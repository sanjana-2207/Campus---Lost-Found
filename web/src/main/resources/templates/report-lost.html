<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Report Lost Item')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="page">
    <header class="page-head">
        <h1>Report a lost item</h1>
        <p>Describe what you lost so finders can recognise it and get in touch.</p>
        <a th:replace="~{fragments/back :: back}"></a>
    </header>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <form th:action="@{/report-lost}" method="post" class="card form-card">
        <label class="field">
            <span>Item title *</span>
            <input type="text" name="title" th:value="${title}" required maxlength="120"
                   placeholder="For example: Black Dell laptop charger">
        </label>

        <div class="form-row">
            <label class="field">
                <span>Category *</span>
                <select name="categoryId" required>
                    <option value="">Select category</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}" th:text="${category.name}"
                            th:selected="${categoryId != null and categoryId == category.id}"></option>
                </select>
            </label>
            <label class="field">
                <span>Last seen location *</span>
                <select name="locationId" required>
                    <option value="">Select location</option>
                    <option th:each="location : ${locations}"
                            th:value="${location.id}" th:text="${location.name}"
                            th:selected="${locationId != null and locationId == location.id}"></option>
                </select>
            </label>
        </div>

        <div class="form-row">
            <label class="field">
                <span>Date lost *</span>
                <input type="text" name="eventDate" th:value="${eventDate != null ? eventDate : today}"
                       placeholder="dd-MM-yyyy" required>
            </label>
            <label class="field">
                <span>Reward note (optional)</span>
                <input type="text" name="reward" th:value="${reward}" maxlength="80"
                       placeholder="For example: small thank-you reward">
            </label>
        </div>

        <label class="field">
            <span>Contact details (optional)</span>
            <input type="text" name="contactInfo" th:value="${contactInfo}" maxlength="120"
                   placeholder="How should a finder reach you?">
        </label>

        <label class="field">
            <span>Description * - colour, brand, marks, contents</span>
            <textarea name="description" rows="4" required maxlength="5000"
                      th:text="${description}"
                      placeholder="Describe the item clearly so a finder can identify it."></textarea>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit report</button>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
