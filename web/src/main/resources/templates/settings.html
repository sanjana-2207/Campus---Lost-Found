<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Settings')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="page narrow">
    <header class="page-head">
        <h1>Settings</h1>
        <p>Manage your REC Lost &amp; Found account and profile information.</p>
        <a th:replace="~{fragments/back :: back}"></a>
    </header>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="card settings-card">
        <div class="settings-head">
            <span class="settings-icon">👤</span>
            <div>
                <h2>Profile Information</h2>
                <p class="muted">Update your personal information.</p>
            </div>
        </div>

        <form th:action="@{/settings/profile}" method="post" class="form-stack">
            <div class="form-row">
                <label class="field">
                    <span>Full Name</span>
                    <input type="text" name="fullName" th:value="${currentUser.fullName}" required>
                </label>
                <label class="field">
                    <span>Email Address</span>
                    <input type="email" th:value="${currentUser.email}" readonly class="readonly">
                </label>
            </div>
            <div class="form-row">
                <label class="field">
                    <span>Phone Number</span>
                    <input type="text" name="phone" th:value="${currentUser.phone}" required>
                </label>
                <label class="field">
                    <span>Gender</span>
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male" th:selected="${currentUser.gender == 'Male'}">Male</option>
                        <option value="Female" th:selected="${currentUser.gender == 'Female'}">Female</option>
                        <option value="Other" th:selected="${currentUser.gender == 'Other'}">Other</option>
                        <option value="Prefer not to say"
                                th:selected="${currentUser.gender == 'Prefer not to say'}">Prefer not to say</option>
                    </select>
                </label>
            </div>
            <div class="form-row">
                <label class="field">
                    <span>Account Role</span>
                    <input type="text" th:value="${currentUser.role.label}" readonly class="readonly">
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Profile</button>
            </div>
        </form>
    </section>

    <section class="card settings-card">
        <div class="settings-head">
            <span class="settings-icon">🔐</span>
            <div>
                <h2>Change Password</h2>
                <p class="muted">Update your account password securely.</p>
            </div>
        </div>

        <form th:action="@{/settings/password}" method="post" class="form-stack">
            <label class="field">
                <span>Current Password</span>
                <input type="password" name="currentPassword" required>
            </label>
            <div class="form-row">
                <label class="field">
                    <span>New Password</span>
                    <input type="password" name="newPassword" required>
                </label>
                <label class="field">
                    <span>Confirm New Password</span>
                    <input type="password" name="confirmPassword" required>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Change Password</button>
            </div>
        </form>
    </section>

    <section class="card settings-card">
        <div class="settings-head">
            <span class="settings-icon">⚙️</span>
            <div>
                <h2>Account</h2>
                <p class="muted">Manage your REC Lost &amp; Found account.</p>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="form-actions">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
