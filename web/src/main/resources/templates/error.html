<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Something went wrong')}"></head>
<body>
<main class="page narrow error-page">
    <div class="card empty-state">
        <span>⚠️</span>
        <h1 th:text="${status != null ? status : 'Error'}">Error</h1>
        <h2 th:text="${error != null ? error : 'Something went wrong'}">Something went wrong</h2>
        <p class="muted">Please go back and try again.</p>
        <div class="form-actions center">
            <a th:href="@{/dashboard}" class="btn btn-primary">Go to dashboard</a>
            <a th:href="@{/login}" class="btn btn-secondary">Sign in</a>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
