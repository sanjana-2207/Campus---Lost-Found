server.port=${PORT:8080}

spring.application.name=REC Lost and Found

# In-memory demo database (data resets when the app restarts).
spring.datasource.url=jdbc:h2:mem:rec_lost_found;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The H2 console is disabled on public deployments. Set H2_CONSOLE=true
# locally if you need to inspect the in-memory database.
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

spring.messages.basename=messages
server.error.whitelabel.enabled=false
